[project]
name = "sandbagging-evaluation"
version = "0.1.0"
description = "Sandbagging evaluations built on UK AISI Inspect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "inspect-ai>=0.3.287",
    "matplotlib>=3.11.2",
    "openai>=3.42.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sandbagging-evaluation = "sandbagging_evaluation:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
    "ruff>=0.17.3",
]
